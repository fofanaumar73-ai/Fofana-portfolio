<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

<title>Private Chat | FOFANA.</title>

<link rel="stylesheet" href="style.css">

<style>
    
        * {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}


html,
body {
    width: 100%;
    height: 100%;
    margin: 0;

    overflow: hidden;
}


body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(154, 67, 255, 0.16),
            transparent 38%
        ),
        #07030b;

    color: #ffffff;
}


        /* =====================================================
           CHAT PAGE
        ====================================================== */

.chat-page {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    max-width: 1100px;
    margin: 0 auto;

    background: #09050d;

    overflow: hidden;
}
    

/* =====================================================
   CHAT HEADER
====================================================== */

.chat-header {
    flex-shrink: 0;

    position: relative;
    z-index: 20;

    height: 76px;

    display: flex;
    align-items: center;

    padding: 0 20px;

    border-bottom:
        1px solid rgba(
            255,
            255,
            255,
            0.08
        );

    background:
        rgba(
            10,
            5,
            15,
            0.96
        );

    backdrop-filter: blur(12px);
}

        /* =====================================================
           PROFILE HEADER
        ====================================================== */

        .chat-profile-button {
            flex: 1;

            min-width: 0;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 5px 8px;

            border: none;

            background: transparent;

            color: #ffffff;

            text-align: left;

            cursor: pointer;

            border-radius: 14px;
        }


        .chat-profile-button:hover {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );
        }


        .chat-avatar {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #7b2cff,
                    #c66bff
                );

            color: #ffffff;

            font-size: 18px;
            font-weight: 800;

            overflow: hidden;
        }


        .chat-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        .chat-profile-info {
            min-width: 0;

            display: flex;
            flex-direction: column;

            gap: 3px;
        }


        .chat-profile-name {
            font-size: 16px;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .chat-profile-role {
            color: rgba(
                255,
                255,
                255,
                0.58
            );

            font-size: 12px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.8px;
        }


        /* =====================================================
           CONNECTION STATUS
        ====================================================== */

        .chat-header-status {
            flex-shrink: 0;

            display: flex;
            align-items: center;

            gap: 6px;

            color: #72c697;

            font-size: 11px;
            font-weight: 700;
        }


        .chat-status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #72c697;
        }


/* =====================================================
   CHAT BODY
====================================================== */

.chat-body {
    flex: 1;

    min-height: 0;

    display: flex;
    flex-direction: column;

    overflow: hidden;
    overflow-x: hidden;
    
    background:
        linear-gradient(
            180deg,
            rgba(
                255,
                255,
                255,
                0.015
            ),
            rgba(
                0,
                0,
                0,
                0.08
            )
        );
}


        /* =====================================================
           MESSAGES
        ====================================================== */

        .chat-messages {
            flex: 1;

            min-height: 0;

                overflow-y: auto;
    overflow-x: hidden;
            
            padding:
                24px
                20px
                28px;

            display: flex;
            flex-direction: column;

            gap: 9px;

            scroll-behavior: smooth;

            overscroll-behavior:
                contain;
        }


        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }


        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }


        .chat-messages::-webkit-scrollbar-thumb {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            border-radius: 20px;
        }


        /* =====================================================
           EMPTY / LOADING STATE
        ====================================================== */

        .chat-empty-state {
            flex: 1;

            min-height: 250px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

            padding: 30px;
        }


        .chat-empty-icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            border-radius: 50%;

            background:
                rgba(
                    166,
                    91,
                    255,
                    0.12
                );

            color: #b56cff;

            font-size: 25px;
        }


        .chat-empty-state p {
            margin: 4px 0;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================================================
           MESSAGE BUBBLES
        ====================================================== */

        .chat-message {
            position: relative;

            width: fit-content;

            max-width: min(
                72%,
                600px
            );

            padding:
                11px
                14px
                9px;

            border-radius: 16px;

            word-wrap: break-word;

            overflow-wrap: anywhere;

            animation:
                messageAppear
                0.18s ease;
        }


        @keyframes messageAppear {

            from {
                opacity: 0;
                transform:
                    translateY(5px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        /* =====================================================
           ADMIN / FOFANA MESSAGE
        ====================================================== */

        .chat-message.admin {
            align-self: flex-start;

            background:
                #20242b;

            color: #ffffff;

            border-top-left-radius: 5px;
        }


        /* =====================================================
           CLIENT MESSAGE
        ====================================================== */

        .chat-message.client {
            align-self: flex-end;

            background:
                #111111;

            color: #ffffff;

            border-top-right-radius: 5px;
        }


        .chat-message-text {
            margin: 0;

            font-size: 15px;

            line-height: 1.5;

            white-space: pre-wrap;
        }


        .chat-message-time {
            display: block;

            margin-top: 6px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.48
                );

            font-size: 10px;

            text-align: right;
        }


        /* =====================================================
           MESSAGE COMPOSER
        ====================================================== */

.chat-composer {
    flex-shrink: 0;

    position: relative;
    z-index: 30;

    display: flex;
            align-items: flex-end;

            gap: 10px;

            padding:
                12px
                16px
                calc(
                    12px +
                    env(
                        safe-area-inset-bottom
                    )
                );

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            background:
                #0d0912;
        }


        .chat-input-wrapper {
            flex: 1;

            min-width: 0;

            display: flex;
            align-items: flex-end;

            padding: 0;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.13
                );

            border-radius: 15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }


        .chat-input-wrapper:focus-within {
            border-color:
                rgba(
                    181,
                    108,
                    255,
                    0.7
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );
        }


        .chat-input {
            width: 100%;

            min-height: 48px;
            max-height: 130px;

            padding:
                13px
                15px;

            border: none;

            outline: none;

            resize: none;

            overflow-y: auto;

            background: transparent;

            color: #ffffff;

            caret-color: #ffffff;

            font-family: inherit;

            font-size: 15px;

            line-height: 1.45;
        }


        .chat-input::placeholder {
            color:
                rgba(
                    255,
                    255,
                    255,
                    0.42
                );
        }


        .chat-input::-webkit-scrollbar {
            width: 4px;
        }


        .chat-input::-webkit-scrollbar-thumb {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            border-radius: 20px;
        }


        /* =====================================================
           SEND BUTTON
        ====================================================== */

        .chat-send-button {
            flex-shrink: 0;

            min-width: 76px;
            height: 48px;

            padding: 0 15px;

            border: none;

            border-radius: 13px;

            background:
                #ffffff;

            color: #111111;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 0.8px;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }


        .chat-send-button:hover {
            transform:
                translateY(-1px);
        }


        .chat-send-button:active {
            transform:
                translateY(0);
        }


        .chat-send-button:disabled {
            opacity: 0.45;

            cursor: not-allowed;

            transform: none;
        }


    /* =====================================================
   CHAT ATTACHMENTS
====================================================== */

.chat-attachment-button {
    flex-shrink: 0;

    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 13px;

    background: rgba(255,255,255,0.05);
    color: #ffffff;

    font-size: 20px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.15s ease;
}

.chat-attachment-button:hover {
    background: rgba(255,255,255,0.10);
}

.chat-attachment-button:active {
    transform: scale(0.95);
}


/* ATTACHMENT PREVIEW */

.chat-attachment-preview {
    flex-shrink: 0;

    display: flex;
    align-items: center;

    gap: 10px;

    margin: 0 16px 8px;
    padding: 10px 12px;

    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;

    background: rgba(255,255,255,0.05);
}

.attachment-preview-icon {
    flex-shrink: 0;

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background: rgba(181,108,255,0.14);

    font-size: 18px;
}

.attachment-preview-info {
    flex: 1;
    min-width: 0;

    display: flex;
    flex-direction: column;

    gap: 3px;
}

.attachment-preview-info strong {
    overflow: hidden;

    color: #ffffff;

    font-size: 13px;

    white-space: nowrap;
    text-overflow: ellipsis;
}

.attachment-preview-info span {
    color: rgba(255,255,255,0.45);

    font-size: 11px;
}

.remove-attachment-button {
    flex-shrink: 0;

    width: 30px;
    height: 30px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,0.08);
    color: #ffffff;

    font-size: 20px;
    line-height: 1;

    cursor: pointer;
}


/* ATTACHMENT INSIDE MESSAGE */

.chat-message-attachment {
    margin-bottom: 7px;
}

.chat-message-attachment a {
    display: flex;
    align-items: center;

    gap: 9px;

    max-width: 100%;

    padding: 9px 10px;

    border-radius: 10px;

    background: rgba(255,255,255,0.07);

    color: #ffffff;

    text-decoration: none;

    font-size: 13px;
}

.chat-message-attachment a:hover {
    background: rgba(255,255,255,0.12);
}

.chat-message-attachment-icon {
    flex-shrink: 0;
}

.chat-message-attachment-name {
    min-width: 0;

    overflow: hidden;

    text-overflow: ellipsis;
    white-space: nowrap;
}

.chat-message-image {
    display: block;

    max-width: 260px;
    max-height: 300px;

    margin-bottom: 7px;

    border-radius: 12px;

    object-fit: contain;

    cursor: pointer;
}

    
        /* =====================================================
           ERROR MESSAGE
        ====================================================== */

        .chat-error {
            display: none;

            flex-shrink: 0;

            padding:
                8px
                16px;

            background:
                rgba(
                    180,
                    0,
                    0,
                    0.15
                );

            color:
                #ff9c9c;

            font-size: 12px;

            line-height: 1.4;
        }


        .chat-error.visible {
            display: block;
        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 800px) {

            .chat-page {
                max-width: none;

            .chat-message {

            .chat-message {

.chat-composer {

        }

        
    </style>

        /* =====================================================
   CHAT ATTACHMENTS
====================================================== */

const chatAttachmentButton =
    document.getElementById(
        "chatAttachmentButton"
    );

const chatFileInput =
    document.getElementById(
        "chatFileInput"
    );

const chatAttachmentPreview =
    document.getElementById(

    );


let pendingAttachment = null;


        /* =====================================================
   SELECT ATTACHMENT
====================================================== */

function formatFileSize(bytes) {

    if (!bytes) {
        return "0 Bytes";
    }

    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];

    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        parseFloat(
            (
                bytes /
                Math.pow(
                    1024,
                    index
                )
            ).toFixed(1)
        ) +
        " " +
        units[index]
    );
}


chatAttachmentButton.addEventListener(
    "click",
    function () {

        chatFileInput.click();

    }
);


chatFileInput.addEventListener(
    "change",
    function () {

        const file =
            this.files &&
            this.files[0];

        if (!file) {
            return;
        }


        /* MAXIMUM FILE SIZE: 10 MB */

        const maxFileSize =
            100 * 1024 * 1024;

        if (file.size > maxFileSize) {

            showChatError(
                "File is too large. Maximum size is 10 MB."
            );

            this.value = "";

            return;
        }


        clearChatError();


        pendingAttachment =
            file;


        chatAttachmentName.textContent =
            file.name;


        chatAttachmentSize.textContent =
            formatFileSize(
                file.size
            );


        chatAttachmentPreview.style.display =
            "flex";

    }
);


removeChatAttachment.addEventListener(
    "click",
    function () {

        pendingAttachment =
            null;


        chatFileInput.value =
            "";


        chatAttachmentName.textContent =
            "";


        chatAttachmentSize.textContent =
            "";


        chatAttachmentPreview.style.display =
            "none";

    }
);
        

        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =====================================================
           FORMAT TIME
        ====================================================== */

        function formatChatTime(
            dateValue
        ) {

            if (!dateValue) {
                return "";
            }


            const date =
                new Date(
                    dateValue
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return "";
            }


            return date.toLocaleString(
                undefined,
                {
                    month: "short",
                    day: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                }
            );

        }



        /* =====================================================
           SHOW ERROR
        ====================================================== */

        function showChatError(
            message
        ) {

            chatError.textContent =
                message;

            chatError.classList.add(
                "visible"
            );

        }



        function clearChatError() {

            chatError.textContent = "";

            chatError.classList.remove(
                "visible"
            );

        }



        /* =====================================================
           LOAD CURRENT CLIENT
        ====================================================== */

        async function initializeChat() {

            clearChatError();


            const {
                data: {
                    user
                },
                error: userError
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if (
                userError ||
                !user
            ) {

                window.location.href =
                    "client-login.html";

                return;

            }


            currentUser =
                user;


            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from(
                        "client_profiles"
                    )
                    .select(
                        "id, full_name, role"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .single();


            if (
                profileError ||
                !profile
            ) {

                showChatError(
                    "We could not load your client profile."
                );

                return;

            }


            /* =============================================
               ADMIN SHOULD NOT USE CLIENT CHAT
            ============================================== */

            if (
                profile.role ===
                "admin"
            ) {

                window.location.href =
                    "admin.html";

                return;

            }


            if (
                profile.role !==
                "client"
            ) {

                showChatError(
                    "Your account does not have a valid client role."
                );

                return;

            }


            currentClientId =
                user.id;


            /* =============================================
               CURRENT ADMIN HEADER
            ============================================== */

            document.getElementById(
                "chatProfileName"
            ).textContent =
                "FOFANA";


            document.getElementById(
                "chatProfileRole"
            ).textContent =
                "ADMIN";


            document.getElementById(
                "chatAvatar"
            ).textContent =
                "F";


            await loadMessages();

        }


/* =====================================================
   BUILD ATTACHMENT HTML
====================================================== */

async function buildAttachmentHtml(item) {

    if (!item.attachment_path) {
        return "";
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from("client-chat-files")
            .createSignedUrl(
                item.attachment_path,
                3600
            );


    if (error || !data || !data.signedUrl) {

        console.error(
            "Attachment URL error:",
            error
        );

        return `
            <div class="chat-message-attachment">
                <span class="chat-message-attachment-icon">
                    📎
                </span>
                <span class="chat-message-attachment-name">
                    ${escapeHtml(
                        item.attachment_name ||
                        "Attachment"
                    )}
                </span>
            </div>
        `;
    }


    const fileUrl =
        data.signedUrl;


    const fileName =
        escapeHtml(
            item.attachment_name ||
            "Attachment"
        );


    const fileType =
        item.attachment_type ||
        "";


    /* IMAGE */

    if (
        fileType.startsWith(
            "image/"
        )
    ) {

        return `
            <div class="chat-message-attachment">
                <a
                    href="${fileUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <img
                        src="${fileUrl}"
                        alt="${fileName}"
                        class="chat-message-image"
                    >
                </a>
            </div>
        `;
    }


    /* OTHER FILE */

    return `
        <div class="chat-message-attachment">

            <a
                href="${fileUrl}"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="chat-message-attachment-icon">
                    📎
                </span>

                <span class="chat-message-attachment-name">
                    ${fileName}
                </span>

            </a>

        </div>
    `;
}


        /* =====================================================
   LOAD MESSAGES
====================================================== */

async function loadMessages() {

    if (!currentClientId) {
        return;
    }


    clearChatError();


    const {
        data,
        error
    } =
        await supabaseClient
            .from("client_messages")
            .select(`
                id,
                client_id,
                sender_id,
                sender_role,
                message,
                is_read,
                created_at,
                attachment_path,
                attachment_name,
                attachment_type,
                attachment_size
            `)
            .eq(
                "client_id",
                currentClientId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Chat loading error:",
            error
        );


        chatMessages.innerHTML = `
            <div class="chat-empty-state">

                <div class="chat-empty-icon">
                    !
                </div>

                <p>
                    Could not load your messages.
                </p>

            </div>
        `;


        showChatError(
            "Could not load your conversation."
        );


        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        chatMessages.innerHTML = `
            <div class="chat-empty-state">

                <div class="chat-empty-icon">
                    💬
                </div>

                <p>
                    No messages yet.
                </p>

                <p>
                    Send a message to start
                    your private conversation
                    with Fofana.
                </p>

            </div>
        `;


        return;

    }


    chatMessages.innerHTML =
        "";


    for (const item of data) {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            "chat-message " +
            item.sender_role;


        const isOwnMessage =
            item.sender_id === currentUser.id;


        const attachmentHtml =
            await buildAttachmentHtml(
                item
            );


        message.innerHTML = `

            <div class="chat-message-content">

                ${attachmentHtml}

                ${
                    item.message
                        ? `
                            <p class="chat-message-text">
                                ${escapeHtml(
                                    item.message
                                )}
                            </p>
                        `
                        : ""
                }

                <span class="chat-message-time">
                    ${escapeHtml(
                        formatChatTime(
                            item.created_at
                        )
                    )}
                </span>

            </div>

            ${
                isOwnMessage
                    ? `
                        <button
                            type="button"
                            class="chat-message-menu"
                            data-message-id="${item.id}"
                            aria-label="Message options"
                            title="Message options"
                        >
                            ⋯
                        </button>
                    `
                    : ""
            }

        `;


        chatMessages.appendChild(
            message
        );

    }


    scrollToLatest();

}
        

        /* =====================================================
   DELETE MESSAGE
====================================================== */

async function deleteMessage(messageId) {

    if (!messageId) {
        return;
    }


    const confirmed =
        window.confirm(
            "Delete this message?"
        );


    if (!confirmed) {
        return;
    }


    clearChatError();


const {
    data: messageData,
    error: fetchError
} =
    await supabaseClient
        .from("client_messages")
        .select(
            "id, attachment_path"
        )
        .eq("id", messageId)
        .eq(
            "sender_id",
            currentUser.id
        )
        .single();


if (fetchError || !messageData) {

    console.error(
        "Message fetch before delete error:",
        fetchError
    );

    showChatError(
        "Could not find this message."
    );

    return;
}


/* DELETE ATTACHMENT FROM STORAGE */

if (messageData.attachment_path) {

    const {
        error: storageError
    } =
        await supabaseClient
            .storage
            .from("client-chat-files")
            .remove([
                messageData.attachment_path
            ]);


    if (storageError) {

        console.error(
            "Attachment delete error:",
            storageError
        );

        showChatError(
            "Could not delete the attached file."
        );

        return;
    }
}


/* DELETE MESSAGE */

const {
    error
} =
    await supabaseClient
        .from("client_messages")
        .delete()
        .eq("id", messageId)
        .eq(
            "sender_id",
            currentUser.id
        );


if (error) {

    console.error(
        "Message delete error:",
        error
    );

    showChatError(
        "Could not delete this message."
    );

    return;
}

    if (error) {

        console.error(
            "Message delete error:",
            error
        );


        showChatError(
            "Could not delete this message."
        );


        return;
    }


    await loadMessages();

}


        /* =====================================================
   MESSAGE MENU
====================================================== */

chatMessages.addEventListener(
    "click",
    function (event) {

        const menuButton =
            event.target.closest(
                ".chat-message-menu"
            );


        if (!menuButton) {
            return;
        }


        const messageId =
            menuButton.dataset.messageId;


        deleteMessage(messageId);

    }
);
        

        /* =====================================================
           SCROLL TO LATEST
        ====================================================== */

        function scrollToLatest() {

            requestAnimationFrame(
                function () {

                    chatMessages.scrollTop =
                        chatMessages.scrollHeight;

                }
            );

        }


        /* =====================================================
   SEND MESSAGE
====================================================== */

async function sendMessage() {

    if (
        !currentClientId ||
        !currentUser
    ) {
        return;
    }


    const message =
        chatInput.value.trim();


    if (
        !message &&
        !pendingAttachment
    ) {
        return;
    }


    clearChatError();


    chatInput.disabled =
        true;

    chatAttachmentButton.disabled =
        true;

    chatSendButton.disabled =
        true;


    chatSendButton.textContent =
        "SENDING...";


    let uploadedFilePath =
        null;


    try {

        /* =================================================
           UPLOAD ATTACHMENT
        ================================================= */

        if (pendingAttachment) {

            const safeName =
                pendingAttachment.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            uploadedFilePath =
                `${currentUser.id}/${crypto.randomUUID()}-${safeName}`;


            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from("client-chat-files")
                    .upload(
                        uploadedFilePath,
                        pendingAttachment,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                pendingAttachment.type ||
                                undefined
                        }
                    );


            if (uploadError) {

                console.error(
                    "Attachment upload error:",
                    uploadError
                );

                throw new Error(
                    "Could not upload the attachment."
                );
            }
        }


        /* =================================================
           INSERT MESSAGE
        ================================================= */

        const {
            error
        } =
            await supabaseClient
                .from(
                    "client_messages"
                )
                .insert({

                    client_id:
                        currentClientId,

                    sender_id:
                        currentUser.id,

                    sender_role:
                        "client",

                    message:
                        message,

                    attachment_path:
                        uploadedFilePath,

                    attachment_name:
                        pendingAttachment
                            ? pendingAttachment.name
                            : null,

                    attachment_type:
                        pendingAttachment
                            ? (
                                pendingAttachment.type ||
                                "application/octet-stream"
                            )
                            : null,

                    attachment_size:
                        pendingAttachment
                            ? pendingAttachment.size
                            : null
                });


        /* =================================================
           DATABASE INSERT FAILED
        ================================================= */

        if (error) {

            console.error(
                "Message send error:",
                error
            );


            /* Remove uploaded file if DB insert failed */

            if (uploadedFilePath) {

                await supabaseClient
                    .storage
                    .from("client-chat-files")
                    .remove([
                        uploadedFilePath
                    ]);
            }


            throw new Error(
                "Could not save your message."
            );
        }


        /* =================================================
           CLEAR MESSAGE
        ================================================= */

        chatInput.value =
            "";


        chatInput.style.height =
            "auto";


        /* =================================================
           CLEAR ATTACHMENT
        ================================================= */

        pendingAttachment =
            null;


        chatFileInput.value =
            "";


        chatAttachmentName.textContent =
            "";


        chatAttachmentSize.textContent =
            "";


        chatAttachmentPreview.style.display =
            "none";


        /* =================================================
           RESTORE CONTROLS
        ================================================= */

        chatInput.disabled =
            false;

        chatAttachmentButton.disabled =
            false;

        chatSendButton.disabled =
            false;


        chatSendButton.textContent =
            "SEND";


        chatInput.focus();


        /* =================================================
           RELOAD CHAT
        ================================================= */

        await loadMessages();

    } catch (error) {

        console.error(
            "Send message error:",
            error
        );


        showChatError(
            error.message ||
            "Could not send your message."
        );


        chatInput.disabled =
            false;

        chatAttachmentButton.disabled =
            false;

        chatSendButton.disabled =
            false;


        chatSendButton.textContent =
            "SEND";
    }

}

        /* =====================================================
   MOBILE KEYBOARD VIEWPORT
====================================================== */

function handleVisualViewport() {

    if (!window.visualViewport) {
        return;
    }

    const viewport =
        window.visualViewport;


    document.documentElement.style.setProperty(
        "--chat-viewport-height",
        `${viewport.height}px`
    );


    document.documentElement.style.setProperty(
        "--chat-viewport-top",
        `${viewport.offsetTop}px`
    );
}


if (window.visualViewport) {

    handleVisualViewport();


    window.visualViewport.addEventListener(
        "resize",
        handleVisualViewport
    );


    window.visualViewport.addEventListener(
        "scroll",
        handleVisualViewport
    );

}
        

        /* =====================================================
           START CHAT
        ====================================================== */

        initializeChat();
