<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Projects | FOFANA</title>

    <style>

    * {
        box-sizing: border-box;
    }


    /* =====================================================
       BODY
    ===================================================== */

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            radial-gradient(
                circle at 85% 0%,
                rgba(145, 65, 255, 0.20),
                transparent 32%
            ),
            radial-gradient(
                circle at 10% 35%,
                rgba(91, 35, 140, 0.08),
                transparent 30%
            ),
            #07030b;

        color: #ffffff;
    }


    /* =====================================================
       STICKY PAGE HEADER
    ===================================================== */

    .page-header {
        position: sticky;
        top: 0;
        z-index: 1000;

        width: 100%;

        padding:
            18px
            max(20px, calc((100% - 1100px) / 2))
            20px;

        background:
            rgba(7, 3, 11, 0.88);

        border-bottom:
            1px solid
            rgba(255,255,255,0.08);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }


    /* =====================================================
       BACK TO DASHBOARD
    ===================================================== */

    .back-button {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        gap: 8px;

        border:
            1px solid
            rgba(255,255,255,0.16);

        background:
            rgba(255,255,255,0.06);

        color: #ffffff;

        padding:
            10px
            15px;

        border-radius: 11px;

        cursor: pointer;

        font-size: 14px;
        font-weight: 600;

        text-decoration: none;

        transition:
            background 0.2s ease,
            border-color 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .back-button:hover {
        background:
            rgba(181,108,255,0.14);

        border-color:
            rgba(181,108,255,0.45);

        box-shadow:
            0 8px 25px
            rgba(145,65,255,0.15);

        transform:
            translateY(-1px);
    }


    /* =====================================================
       PAGE INTRO
    ===================================================== */

    .eyebrow {
        max-width: 1100px;

        margin:
            34px
            auto
            0;

        color: #b56cff;

        font-size: 12px;
        font-weight: 800;

        letter-spacing: 5px;

        text-transform: uppercase;
    }


    h1 {
        max-width: 1100px;

        margin:
            12px
            auto
            8px;

        font-size:
            clamp(
                36px,
                6vw,
                56px
            );

        line-height: 1.05;

        letter-spacing: -1.5px;
    }


    .page-description {
        max-width: 1100px;

        margin:
            0
            auto;

        color:
            rgba(255,255,255,0.66);

        font-size: 16px;

        line-height: 1.7;
    }


    /* =====================================================
       PROJECT WRAPPER
    ===================================================== */

    .projects-wrapper {
        max-width: 1100px;

        margin:
            38px
            auto
            90px;

        padding:
            0 20px;
    }


    /* =====================================================
       FILTERS
    ===================================================== */

    .project-filters {
        display: flex;

        flex-wrap: wrap;

        gap: 9px;

        margin-bottom: 28px;
    }


    .filter-button {
        border:
            1px solid
            rgba(255,255,255,0.13);

        background:
            rgba(255,255,255,0.045);

        color:
            rgba(255,255,255,0.82);

        padding:
            10px
            17px;

        border-radius: 999px;

        cursor: pointer;

        font-size: 13px;
        font-weight: 700;

        transition:
            all 0.2s ease;
    }


    .filter-button:hover {
        border-color:
            rgba(181,108,255,0.45);

        background:
            rgba(181,108,255,0.10);

        color: #ffffff;
    }


    .filter-button.active {
        background: #ffffff;

        color: #111111;

        border-color: #ffffff;

        box-shadow:
            0 6px 20px
            rgba(255,255,255,0.08);
    }


    /* =====================================================
       PROJECT GRID
    ===================================================== */

    .projects-grid {
        display: grid;

        grid-template-columns:
            repeat(
                auto-fit,
                minmax(280px, 1fr)
            );

        gap: 22px;
    }


    /* =====================================================
       PROJECT CARD
    ===================================================== */

    .project-card {
        position: relative;

        background:
            linear-gradient(
                145deg,
                #ffffff,
                #f7f7f9
            );

        color: #111111;

        border:
            1px solid
            rgba(255,255,255,0.65);

        border-radius: 24px;

        padding: 26px;

        min-height: 285px;

        display: flex;

        flex-direction: column;

        overflow: hidden;

        box-shadow:
            0 20px 65px
            rgba(0,0,0,0.28);

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease;
    }


    .project-card::before {
        content: "";

        position: absolute;

        top: 0;
        left: 0;
        right: 0;

        height: 3px;

        background:
            linear-gradient(
                90deg,
                #8f3dff,
                #c27aff,
                transparent
            );

        opacity: 0.8;
    }


    .project-card:hover {
        transform:
            translateY(-4px);

        box-shadow:
            0 28px 75px
            rgba(0,0,0,0.36);
    }


    .project-card.hidden {
        display: none;
    }


    /* =====================================================
       PROJECT TOP
    ===================================================== */

    .project-top {
        display: flex;

        justify-content: space-between;

        align-items: flex-start;

        gap: 14px;

        margin-bottom: 18px;
    }


    .project-title {
        margin: 0;

        font-size: 23px;

        line-height: 1.25;

        letter-spacing: -0.3px;
    }


    /* =====================================================
       STATUS BADGES
    ===================================================== */

    .status-badge {
        flex-shrink: 0;

        padding:
            7px
            11px;

        border-radius: 999px;

        font-size: 10px;

        font-weight: 900;

        letter-spacing: 0.6px;
    }


    .status-incomplete {
        background: #ffe5e5;
        color: #a00000;
    }


    .status-pending {
        background: #fff1c9;
        color: #865900;
    }


    .status-complete {
        background: #dcf7e7;
        color: #16743b;
    }


    /* =====================================================
       PROJECT TYPE
    ===================================================== */

    .project-type {
        display: inline-block;

        width: fit-content;

        margin-bottom: 15px;

        padding:
            7px
            11px;

        border-radius: 999px;

        background:
            #eeeeF2;

        color:
            #4a4f5c;

        font-size: 11px;

        font-weight: 800;

        letter-spacing: 0.2px;
    }


    /* =====================================================
       DESCRIPTION
    ===================================================== */

    .project-description {
        color: #62646b;

        font-size: 14px;

        line-height: 1.75;

        margin:
            0
            0
            22px;
    }


    /* =====================================================
       DATE
    ===================================================== */

    .project-date {
        color: #8a8c92;

        font-size: 11px;

        margin-top: auto;

        margin-bottom: 16px;
    }


    /* =====================================================
       VIEW DETAILS BUTTON
    ===================================================== */

    .view-project-button {
        width: 100%;

        border: none;

        border-radius: 12px;

        padding:
            14px
            16px;

        background:
            linear-gradient(
                135deg,
                #111111,
                #1c1721
            );

        color: #ffffff;

        font-size: 11px;

        font-weight: 900;

        letter-spacing: 0.8px;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;
    }


    .view-project-button:hover {
        background:
            linear-gradient(
                135deg,
                #17101d,
                #35104f
            );

        transform:
            translateY(-1px);

        box-shadow:
            0 8px 24px
            rgba(91,35,140,0.25);
    }


    /* =====================================================
       EMPTY / LOADING / ERROR
    ===================================================== */

    .empty-state,
    .loading-state,
    .error-state {
        grid-column: 1 / -1;

        background:
            rgba(255,255,255,0.97);

        color: #555555;

        border-radius: 22px;

        padding:
            45px
            25px;

        text-align: center;

        font-size: 15px;

        line-height: 1.6;
    }


    .error-state {
        color: #9b0000;
    }


    /* =====================================================
       PROJECT MODAL
    ===================================================== */

    .project-modal {
        position: fixed;

        inset: 0;

        z-index: 9999;

        display: none;

        align-items: center;
        justify-content: center;

        padding: 20px;

        background:
            rgba(0,0,0,0.80);

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }


    .project-modal.open {
        display: flex;
    }


    .modal-content {
        width:
            min(
                650px,
                100%
            );

        max-height: 90vh;

        overflow-y: auto;

        background:
            linear-gradient(
                145deg,
                #ffffff,
                #f7f7f9
            );

        color: #111111;

        border-radius: 26px;

        padding: 30px;

        position: relative;

        box-shadow:
            0 35px 100px
            rgba(0,0,0,0.5);
    }


    .modal-close {
        position: absolute;

        top: 15px;
        right: 15px;

        width: 38px;
        height: 38px;

        border: none;

        border-radius: 50%;

        background: #eeeeee;

        color: #111111;

        font-size: 20px;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            background 0.2s ease;
    }


    .modal-close:hover {
        background: #e1d5eb;

        transform:
            rotate(90deg);
    }


    .modal-status {
        display: inline-block;

        margin-bottom: 15px;
    }


    .modal-content h2 {
        margin:
            0
            45px
            12px
            0;

        font-size: 28px;

        line-height: 1.2;
    }


    .modal-content p {
        color: #666666;

        line-height: 1.75;
    }


    /* =====================================================
       PROJECT INFORMATION
    ===================================================== */

    .project-info {
        margin-top: 25px;

        padding: 18px;

        border-radius: 16px;

        background:
            #f1f1f4;
    }


    .project-info-row {
        display: flex;

        justify-content: space-between;

        gap: 20px;

        padding: 11px 0;

        border-bottom:
            1px solid
            #e1e1e3;
    }


    .project-info-row:last-child {
        border-bottom: none;
    }


    .project-info-label {
        color: #777777;

        font-size: 13px;
    }


    .project-info-value {
        font-weight: 700;

        text-align: right;

        font-size: 13px;
    }


    /* =====================================================
       STATUS MESSAGE
    ===================================================== */

    .status-message {
        margin-top: 22px;

        padding: 18px;

        border-radius: 15px;

        line-height: 1.65;

        font-size: 14px;
    }


    .status-message.incomplete {
        background: #fff0f0;

        color: #8c0000;
    }


    .status-message.pending {
        background: #fff8df;

        color: #795000;
    }


    .status-message.complete {
        background: #eafaf0;

        color: #176b38;
    }


    /* =====================================================
       ACCESS PROJECT
    ===================================================== */

    .access-project-button {
        display: block;

        width: 100%;

        margin-top: 22px;

        padding: 15px;

        border: none;

        border-radius: 13px;

        background:
            linear-gradient(
                135deg,
                #111111,
                #35104f
            );

        color: #ffffff;

        text-align: center;

        text-decoration: none;

        font-size: 12px;

        font-weight: 900;

        letter-spacing: 0.7px;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }


    .access-project-button:hover {
        transform:
            translateY(-1px);

        box-shadow:
            0 10px 28px
            rgba(91,35,140,0.25);
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

        .page-header {
            padding:
                13px
                16px
                15px;
        }


        .back-button {
            font-size: 13px;

            padding:
                9px
                13px;
        }


        .eyebrow {
            margin-top: 27px;

            font-size: 11px;

            letter-spacing: 4px;
        }


        h1 {
            margin-top: 10px;

            font-size: 38px;

            letter-spacing: -1px;
        }


        .page-description {
            font-size: 14px;

            line-height: 1.6;
        }


        .projects-wrapper {
            padding:
                0
                16px;

            margin:
                28px
                auto
                60px;
        }


        .project-filters {
            gap: 7px;

            overflow-x: auto;

            flex-wrap: nowrap;

            padding-bottom: 5px;

            scrollbar-width: none;
        }


        .project-filters::-webkit-scrollbar {
            display: none;
        }


        .filter-button {
            flex-shrink: 0;

            padding:
                9px
                14px;

            font-size: 12px;
        }


        .projects-grid {
            grid-template-columns: 1fr;

            gap: 16px;
        }


        .project-card {
            border-radius: 21px;

            padding: 21px;

            min-height: 270px;
        }


        .project-top {
            gap: 10px;
        }


        .project-title {
            font-size: 21px;
        }


        .project-description {
            font-size: 14px;
        }


        .modal-content {
            padding:
                24px
                18px;

            border-radius: 22px;
        }


        .modal-content h2 {
            font-size: 24px;
        }


        .project-info-row {
            flex-direction: column;

            gap: 4px;
        }


        .project-info-value {
            text-align: left;
        }

    }

</style>
    
</head>

<body>

    <header class="page-header">

        <a
            href="client-dashboard.html"
            class="back-button"
        >
            ← Back to Dashboard
        </a>

        <div class="eyebrow">
            CLIENT PORTAL
        </div>

        <h1>My Projects</h1>

        <p class="page-description">
            View your active and completed projects
            assigned by Fofana.
        </p>

    </header>


    <main class="projects-wrapper">

        <div class="project-filters">

            <button
                type="button"
                class="filter-button active"
                data-filter="all"
            >
                All
            </button>

            <button
                type="button"
                class="filter-button"
                data-filter="incomplete"
            >
                Incomplete
            </button>

            <button
                type="button"
                class="filter-button"
                data-filter="pending"
            >
                Pending
            </button>

            <button
                type="button"
                class="filter-button"
                data-filter="complete"
            >
                Completed
            </button>

        </div>


        <div
            id="projectsContainer"
            class="projects-grid"
        >
            <div class="loading-state">
                Loading your projects...
            </div>
        </div>

    </main>


    <!-- =====================================================
         PROJECT DETAILS MODAL
    ====================================================== -->

    <div
        id="projectModal"
        class="project-modal"
    >

        <div class="modal-content">

            <button
                type="button"
                id="closeProjectModal"
                class="modal-close"
            >
                ×
            </button>

            <span
                id="modalStatus"
                class="status-badge modal-status"
            ></span>

            <h2 id="modalProjectTitle">
                Project
            </h2>

            <p id="modalProjectDescription"></p>

            <div class="project-info">

                <div class="project-info-row">

                    <span class="project-info-label">
                        Project Type
                    </span>

                    <span
                        id="modalProjectType"
                        class="project-info-value"
                    >
                    </span>

                </div>


                <div class="project-info-row">

                    <span class="project-info-label">
                        Created
                    </span>

                    <span
                        id="modalProjectCreated"
                        class="project-info-value"
                    >
                    </span>

                </div>


                <div
                    id="modalCompletedRow"
                    class="project-info-row"
                >

                    <span class="project-info-label">
                        Completed
                    </span>

                    <span
                        id="modalProjectCompleted"
                        class="project-info-value"
                    >
                    </span>

                </div>

            </div>


            <div
                id="modalStatusMessage"
                class="status-message"
            >
            </div>


            <a
                id="accessProjectButton"
                class="access-project-button"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                style="display: none;"
            >
                ACCESS PROJECT
            </a>

        </div>

    </div>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://uryfgatzyesolwwmugin.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_QL4lxGKETA1_xMFFJ7RV5g_Wuyi_x-d";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let allProjects = [];


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(value) {

            if (value === null ||
                value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =====================================================
           FORMAT DATE
        ====================================================== */

        function formatDate(dateValue) {

            if (!dateValue) {
                return "—";
            }

            const date =
                new Date(dateValue);

            if (Number.isNaN(date.getTime())) {
                return "—";
            }

            return date.toLocaleDateString(
                undefined,
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );
        }


        /* =====================================================
           STATUS HELPERS
        ====================================================== */

        function getStatusLabel(status) {

            if (status === "complete") {
                return "COMPLETED";
            }

            if (status === "pending") {
                return "PENDING";
            }

            return "INCOMPLETE";
        }


        function getStatusClass(status) {

            if (status === "complete") {
                return "status-complete";
            }

            if (status === "pending") {
                return "status-pending";
            }

            return "status-incomplete";
        }


        /* =====================================================
           AUTHENTICATION
        ====================================================== */

        async function checkClientAccess() {

            const {
                data: { user },
                error: userError
            } =
                await supabaseClient.auth.getUser();


            if (userError || !user) {

                window.location.href =
                    "client-login.html";

                return null;
            }


            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("client_profiles")
                    .select(
                        "id, full_name, role"
                    )
                    .eq("id", user.id)
                    .single();


            if (profileError ||
                !profile) {

                document.getElementById(
                    "projectsContainer"
                ).innerHTML = `
                    <div class="error-state">
                        We could not load your
                        client profile.
                    </div>
                `;

                return null;
            }


            if (profile.role === "admin") {

                window.location.href =
                    "admin.html";

                return null;
            }


            if (profile.role !== "client") {

                document.getElementById(
                    "projectsContainer"
                ).innerHTML = `
                    <div class="error-state">
                        Your account does not have
                        a valid client role.
                    </div>
                `;

                return null;
            }


            return user;
        }


        /* =====================================================
           LOAD PROJECTS
        ====================================================== */

        async function loadProjects() {

            const container =
                document.getElementById(
                    "projectsContainer"
                );


            const user =
                await checkClientAccess();


            if (!user) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("client_projects")
                    .select(`
                        id,
                        client_id,
                        title,
                        description,
                        project_type,
                        status,
                        access_link,
                        completed_at,
                        created_at,
                        updated_at
                    `)
                    .eq(
                        "client_id",
                        user.id
                    )
                    .order(
                        "updated_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    "Projects loading error:",
                    error
                );

                container.innerHTML = `
                    <div class="error-state">
                        We could not load your
                        projects.
                    </div>
                `;

                return;
            }


            allProjects =
                data || [];


            renderProjects(
                "all"
            );
        }


        /* =====================================================
           RENDER PROJECTS
        ====================================================== */

        function renderProjects(
            filter
        ) {

            const container =
                document.getElementById(
                    "projectsContainer"
                );


            let projects =
                allProjects;


            if (filter !== "all") {

                projects =
                    allProjects.filter(
                        function (project) {

                            return (
                                project.status ===
                                filter
                            );

                        }
                    );
            }


            if (!projects.length) {

                container.innerHTML = `
                    <div class="empty-state">
                        You don't have any
                        projects in this category yet.
                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            projects.forEach(
                function (project) {

                    const card =
                        document.createElement(
                            "article"
                        );

                    card.className =
                        "project-card";


                    card.dataset.status =
                        project.status;


                    card.innerHTML = `

                        <div class="project-top">

                            <h2 class="project-title">
                                ${escapeHtml(
                                    project.title
                                )}
                            </h2>

                            <span
                                class="status-badge
                                ${getStatusClass(
                                    project.status
                                )}"
                            >
                                ${getStatusLabel(
                                    project.status
                                )}
                            </span>

                        </div>


                        ${
                            project.project_type
                            ? `
                                <span class="project-type">
                                    ${escapeHtml(
                                        project.project_type
                                    )}
                                </span>
                            `
                            : ""
                        }


                        <p class="project-description">
                            ${
                                escapeHtml(
                                    project.description ||
                                    "No project description available."
                                )
                            }
                        </p>


                        <div class="project-date">
                            Last updated:
                            ${formatDate(
                                project.updated_at
                            )}
                        </div>


                        <button
                            type="button"
                            class="view-project-button"
                            data-project-id="${escapeHtml(
                                project.id
                            )}"
                        >
                            VIEW DETAILS
                        </button>

                    `;


                    container.appendChild(
                        card
                    );
                }
            );


            document
                .querySelectorAll(
                    ".view-project-button"
                )
                .forEach(
                    function (button) {

                        button.addEventListener(
                            "click",
                            function () {

                                openProjectDetails(
                                    this.dataset.projectId
                                );

                            }
                        );

                    }
                );
        }


        /* =====================================================
           OPEN PROJECT DETAILS
        ====================================================== */

        function openProjectDetails(
            projectId
        ) {

            const project =
                allProjects.find(
                    function (item) {

                        return item.id ===
                            projectId;

                    }
                );


            if (!project) {
                return;
            }


            const modal =
                document.getElementById(
                    "projectModal"
                );


            const modalStatus =
                document.getElementById(
                    "modalStatus"
                );


            const statusMessage =
                document.getElementById(
                    "modalStatusMessage"
                );


            const accessButton =
                document.getElementById(
                    "accessProjectButton"
                );


            modalStatus.textContent =
                getStatusLabel(
                    project.status
                );


            modalStatus.className =
                "status-badge modal-status " +
                getStatusClass(
                    project.status
                );


            document.getElementById(
                "modalProjectTitle"
            ).textContent =
                project.title || "Project";


            document.getElementById(
                "modalProjectDescription"
            ).textContent =
                project.description ||
                "No project description available.";


            document.getElementById(
                "modalProjectType"
            ).textContent =
                project.project_type ||
                "—";


            document.getElementById(
                "modalProjectCreated"
            ).textContent =
                formatDate(
                    project.created_at
                );


            document.getElementById(
                "modalProjectCompleted"
            ).textContent =
                formatDate(
                    project.completed_at
                );


            accessButton.style.display =
                "none";


            /* =================================================
               INCOMPLETE
            ================================================== */

            if (
                project.status ===
                "incomplete"
            ) {

                statusMessage.className =
                    "status-message incomplete";

                statusMessage.textContent =
                    "Your project has not been " +
                    "delivered or completed yet. " +
                    "Please have patience. Fofana " +
                    "is still working on your project.";

            }


            /* =================================================
               PENDING
            ================================================== */

            else if (
                project.status ===
                "pending"
            ) {

                statusMessage.className =
                    "status-message pending";

                statusMessage.textContent =
                    "Your project is almost done! " +
                    "We are putting the finishing " +
                    "touches together. Please have " +
                    "a little more patience.";

            }


            /* =================================================
               COMPLETED
            ================================================== */

            else if (
                project.status ===
                "complete"
            ) {

                statusMessage.className =
                    "status-message complete";

                statusMessage.textContent =
                    "Your project has been completed " +
                    "and is ready for you to access.";

                if (
                    project.access_link &&
                    project.access_link.trim()
                ) {

                    accessButton.href =
                        project.access_link;

                    accessButton.style.display =
                        "block";

                }

            }


            modal.classList.add(
                "open"
            );
        }


        /* =====================================================
           CLOSE MODAL
        ====================================================== */

        document
            .getElementById(
                "closeProjectModal"
            )
            .addEventListener(
                "click",
                function () {

                    document
                        .getElementById(
                            "projectModal"
                        )
                        .classList.remove(
                            "open"
                        );

                }
            );


        document
            .getElementById(
                "projectModal"
            )
            .addEventListener(
                "click",
                function (event) {

                    if (
                        event.target ===
                        this
                    ) {

                        this.classList.remove(
                            "open"
                        );

                    }

                }
            );


        /* =====================================================
           FILTER BUTTONS
        ====================================================== */

        document
            .querySelectorAll(
                ".filter-button"
            )
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            document
                                .querySelectorAll(
                                    ".filter-button"
                                )
                                .forEach(
                                    function (item) {

                                        item.classList
                                            .remove(
                                                "active"
                                            );

                                    }
                                );


                            this.classList.add(
                                "active"
                            );


                            renderProjects(
                                this.dataset.filter
                            );

                        }
                    );

                }
            );


        /* =====================================================
           START
        ====================================================== */

        loadProjects();

    </script>

</body>
</html>
