<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Reviews — FOFANA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="dashboard-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="dashboard-header">

        <div class="dashboard-container">

            <a
                href="index.html"
                class="brand"
            >
                FOFANA<span>.</span>
            </a>


            <div class="manage-header-actions">

                <button
                    type="button"
                    class="dashboard-button"
                    id="addReviewButton"
                >
                    + Add Review
                </button>


                <a
                    href="dashboard.html"
                    class="dashboard-button"
                >
                    Dashboard
                </a>

            </div>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="dashboard-main">

        <div class="dashboard-container">


            <!-- PAGE HEADING -->

            <div class="dashboard-heading">

                <p class="admin-label">
                    PRIVATE AREA
                </p>

                <h1>
                    Manage Reviews
                </h1>

                <p>
                    Add, edit and manage client testimonials.
                </p>

            </div>



            <!-- =================================================
                 CONTROLS
            ================================================== -->

            <div class="project-management-controls">


                <!-- SEARCH -->

                <div class="project-search-box">

                    <input
                        type="search"
                        id="reviewSearch"
                        placeholder="Search reviews..."
                        autocomplete="off"
                    >

                </div>



                <!-- STATUS -->

                <div class="project-filter-box">

                    <select id="reviewStatusFilter">

                        <option value="">
                            All Status
                        </option>

                        <option value="published">
                            Published
                        </option>

                        <option value="draft">
                            Draft
                        </option>

                    </select>

                </div>

            </div>



            <!-- MESSAGE -->

            <div
                id="reviewMessage"
                class="manage-message"
            ></div>



            <!-- =================================================
                 REVIEWS
            ================================================== -->

            <section
                id="reviewsContainer"
                class="review-management-grid"
            >

                <div class="project-loading">
                    Loading reviews...
                </div>

            </section>

        </div>

    </main>



    <!-- =====================================================
         REVIEW MODAL
    ====================================================== -->

    <div
        id="reviewModal"
        class="edit-project-modal"
    >

        <div class="edit-project-modal-card">


            <!-- MODAL HEADER -->

            <div class="edit-project-modal-header">

                <div>

                    <p class="admin-label">
                        CLIENT TESTIMONIAL
                    </p>

                    <h2 id="reviewModalTitle">
                        Add Review
                    </h2>

                </div>


                <button
                    type="button"
                    class="close-edit-project"
                    id="closeReviewModal"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>



            <!-- =================================================
                 FORM
            ================================================== -->

            <form
                id="reviewForm"
                class="edit-project-form"
            >

                <input
                    type="hidden"
                    id="reviewId"
                >


                <!-- CLIENT NAME -->

                <div class="form-group">

                    <label for="clientName">
                        Client Name
                    </label>

                    <input
                        type="text"
                        id="clientName"
                        placeholder="e.g. Ahmed Yusuf"
                        required
                    >

                </div>



                <!-- CLIENT ROLE -->

                <div class="form-group">

                    <label for="clientRole">
                        Client Role / Business
                    </label>

                    <input
                        type="text"
                        id="clientRole"
                        placeholder="e.g. Business Owner"
                    >

                </div>



                <!-- REVIEW -->

                <div class="form-group">

                    <label for="reviewText">
                        Review
                    </label>

                    <textarea
                        id="reviewText"
                        rows="6"
                        placeholder="Write the client's testimonial..."
                        required
                    ></textarea>

                </div>

<div class="form-group">
    <label for="reviewCategory">Category</label>

    <select id="reviewCategory">
        <option value="">General</option>
        <option value="Web Development">Web Development</option>
        <option value="Brochure Design">Brochure Design</option>
        <option value="Presentation Design">Presentation Design</option>
        <option value="Ebook Design">Ebook Design</option>
        <option value="Instagram Carousel">Instagram Carousel</option>
        <option value="Pitch Deck">Pitch Deck</option>
    </select>
</div>

                <!-- RATING -->

                <div class="form-group">

                    <label for="reviewRating">
                        Rating
                    </label>

                    <select id="reviewRating">

                        <option value="5">
                            5 Stars
                        </option>

                        <option value="4">
                            4 Stars
                        </option>

                        <option value="3">
                            3 Stars
                        </option>

                        <option value="2">
                            2 Stars
                        </option>

                        <option value="1">
                            1 Star
                        </option>

                    </select>

                </div>



                <!-- FEATURED -->

                <div class="form-checkbox">

                    <label>

                        <input
                            type="checkbox"
                            id="reviewFeatured"
                        >

                        <span>
                            Featured Review
                        </span>

                    </label>

                </div>



                <!-- STATUS -->

                <div class="form-group">

                    <label for="reviewStatus">
                        Status
                    </label>

                    <select id="reviewStatus">

                        <option value="published">
                            Published
                        </option>

                        <option value="draft">
                            Draft
                        </option>

                    </select>

                </div>



                <!-- FORM MESSAGE -->

                <div
                    id="reviewFormMessage"
                    class="manage-message"
                ></div>



                <!-- ACTIONS -->

                <div class="edit-project-form-actions">

                    <button
                        type="button"
                        class="dashboard-button"
                        id="cancelReview"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="dashboard-button"
                    >
                        Save Review
                    </button>

                </div>

            </form>

        </div>

    </div>



    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
