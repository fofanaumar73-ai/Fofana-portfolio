<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Legal & Policies | FOFANA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
            min-height: 100vh;
        }

        .legal-page {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 70px;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .legal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .legal-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .legal-header p {
            color: #6b7280;
            font-size: 15px;
        }

        .back-button {
            text-decoration: none;
            background: #111827;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .back-button:hover {
            opacity: 0.9;
        }

        /* =====================================================
           POLICY CARDS
        ===================================================== */

        .policies-container {
            display: grid;
            gap: 25px;
        }

        .policy-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.04);
        }

        .policy-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .policy-title-area h2 {
            font-size: 21px;
            margin-bottom: 7px;
        }

        .policy-title-area p {
            color: #6b7280;
            font-size: 13px;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .policy-status {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-draft {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-published {
            background: #ecfdf5;
            color: #047857;
        }

        /* =====================================================
           EDITOR
        ===================================================== */

        .policy-editor {
            width: 100%;
            min-height: 260px;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            resize: vertical;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.7;
            color: #111827;
            background: #ffffff;
        }

        .policy-editor:focus {
            border-color: #111827;
        }

        /* =====================================================
           CARD FOOTER
        ===================================================== */

        .policy-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .last-updated {
            font-size: 12px;
            color: #6b7280;
        }

        .policy-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .policy-button {
            border: none;
            border-radius: 8px;
            padding: 11px 17px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-draft-button {
            background: #e5e7eb;
            color: #111827;
        }

        .publish-button {
            background: #111827;
            color: #ffffff;
        }

        .policy-button:hover {
            opacity: 0.88;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading-message {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            font-size: 15px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .legal-page {
                padding: 25px 15px 50px;
            }

            .legal-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .legal-header h1 {
                font-size: 26px;
            }

            .back-button {
                width: 100%;
                text-align: center;
            }

            .policy-card {
                padding: 18px;
            }

            .policy-card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .policy-editor {
                min-height: 220px;
            }

            .policy-card-footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .policy-actions {
                width: 100%;
            }

            .policy-button {
                flex: 1;
            }
        }

    </style>
</head>

<body>

    <main class="legal-page">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="legal-header">

            <div>
                <h1>
                    Legal & Policies
                </h1>

                <p>
                    Manage your website policies and legal documents.
                </p>
            </div>

            <a
                href="portfolio-settings.html"
                class="back-button"
            >
                ← Back to Settings
            </a>

        </header>


        <!-- =================================================
             POLICIES
        ================================================== -->

        <section
            id="policiesContainer"
            class="policies-container"
        >

            <div class="loading-message">
                Loading policies...
            </div>

        </section>

    </main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
        "https://uryfgatzyesolwwmugin.supabase.co";

    const SUPABASE_KEY =
        "YOUR_EXISTING_SUPABASE_PUBLISHABLE_KEY";

    const portfolioSupabase =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================================================
       LOAD POLICIES
    ========================================================= */

    async function loadPolicies() {

        const container =
            document.getElementById(
                "policiesContainer"
            );

        try {

            const {
                data,
                error
            } =
                await portfolioSupabase
                    .from("legal_policies")
                    .select("*")
                    .order("created_at", {
                        ascending: true
                    });


            if (error) {
                throw error;
            }


            if (!data || data.length === 0) {

                container.innerHTML = `
                    <div class="loading-message">
                        No policies found.
                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            data.forEach(function (policy) {

                const card =
                    document.createElement("article");

                card.className =
                    "policy-card";


                const statusClass =
                    policy.status === "published"
                        ? "status-published"
                        : "status-draft";


                const statusText =
                    policy.status === "published"
                        ? "Published"
                        : "Draft";


                const updatedDate =
                    policy.updated_at
                        ? new Date(
                            policy.updated_at
                        ).toLocaleString()
                        : "Not updated yet";


                card.innerHTML = `

                    <div class="policy-card-header">

                        <div class="policy-title-area">

                            <h2>
                                ${escapeHtml(
                                    policy.title
                                )}
                            </h2>

                            <p>
                                ${getPolicyDescription(
                                    policy.policy_type
                                )}
                            </p>

                        </div>


                        <span
                            class="policy-status ${statusClass}"
                        >
                            ${statusText}
                        </span>

                    </div>


                    <textarea
                        class="policy-editor"
                        data-policy-id="${policy.id}"
                    >${policy.content || ""}</textarea>


                    <div class="policy-card-footer">

                        <span class="last-updated">

                            Last updated:
                            ${updatedDate}

                        </span>


                        <div class="policy-actions">

                            <button
                                type="button"
                                class="policy-button save-draft-button"
                                data-action="draft"
                                data-id="${policy.id}"
                            >
                                Save Draft
                            </button>


                            <button
                                type="button"
                                class="policy-button publish-button"
                                data-action="publish"
                                data-id="${policy.id}"
                            >
                                Publish
                            </button>

                        </div>

                    </div>

                `;


                container.appendChild(card);

            });


            attachPolicyButtons();

        } catch (error) {

            console.error(
                "LOAD POLICIES ERROR:",
                error
            );


            container.innerHTML = `
                <div class="loading-message">
                    Unable to load policies.
                    Please try again.
                </div>
            `;

        }

    }


    /* =========================================================
       POLICY DESCRIPTIONS
    ========================================================= */

    function getPolicyDescription(
        policyType
    ) {

        const descriptions = {

            privacy:
                "How visitor and client information is handled.",

            terms:
                "Rules and conditions for using this website and services.",

            refund:
                "Conditions relating to returns, refunds and cancellations.",

            cookies:
                "Information about cookies and similar website technologies."

        };


        return descriptions[policyType] ||
            "Manage this legal policy.";

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(
        value
    ) {

        const div =
            document.createElement("div");

        div.textContent =
            value || "";

        return div.innerHTML;

    }


    /* =========================================================
       POLICY BUTTONS
    ========================================================= */

    function attachPolicyButtons() {

        const buttons =
            document.querySelectorAll(
                ".policy-button"
            );


        buttons.forEach(function (button) {

            button.addEventListener(
                "click",
                async function () {

                    const policyId =
                        this.dataset.id;

                    const action =
                        this.dataset.action;


                    const editor =
                        document.querySelector(
                            `.policy-editor[data-policy-id="${policyId}"]`
                        );


                    if (!editor) {
                        return;
                    }


                    const content =
                        editor.value;


                    const newStatus =
                        action === "publish"
                            ? "published"
                            : "draft";


                    this.disabled = true;


                    const originalText =
                        this.textContent;


                    this.textContent =
                        action === "publish"
                            ? "Publishing..."
                            : "Saving...";


                    try {

                        const {
                            error
                        } =
                            await portfolioSupabase
                                .from("legal_policies")
                                .update({

                                    content:
                                        content,

                                    status:
                                        newStatus,

                                    updated_at:
                                        new Date().toISOString(),

                                    last_updated:
                                        new Date().toISOString()

                                })
                                .eq(
                                    "id",
                                    policyId
                                );


                        if (error) {
                            throw error;
                        }


                        alert(
                            action === "publish"
                                ? "Policy published successfully."
                                : "Policy saved as draft."
                        );


                        await loadPolicies();

                    } catch (error) {

                        console.error(
                            "SAVE POLICY ERROR:",
                            error
                        );


                        alert(
                            "Unable to save policy. Please try again."
                        );

                    } finally {

                        this.disabled = false;

                        this.textContent =
                            originalText;

                    }

                }
            );

        });

    }


    /* =========================================================
       INITIALIZE
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadPolicies();

        }
    );

</script>
