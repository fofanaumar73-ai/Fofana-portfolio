<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Cookies Policy — FOFANA."
    >

    <title>Cookies Policy | FOFANA.</title>

    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        /* =========================================================
           PUBLIC POLICY PAGE
        ========================================================= */

        .policy-page {

            min-height: 100vh;

            background:
                #f7f2e8;

            color:
                #102f5f;
        }


        /* =========================================================
           STICKY WEBSITE HEADER
        ========================================================= */

        .policy-page .navbar {

            position: sticky;
            top: 0;

            z-index: 9999;

            background:
                rgba(247, 242, 232, 0.94);

            border-bottom:
                1px solid
                rgba(16, 47, 95, 0.10);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);
        }


        .policy-page .brand {

            color:
                #102f5f;
        }


        .policy-page .brand span {

            color:
                #315f9f;
        }


        .policy-page .nav-contact {

            color:
                #ffffff;

            background:
                #102f5f;
        }


        /* =========================================================
           POLICY MAIN
        ========================================================= */

        .policy-main {

            width:
                min(900px, 92%);

            margin:
                0 auto;

            padding:
                70px 0 100px;
        }


        /* =========================================================
           POLICY HEADER
        ========================================================= */

        .policy-heading {

            text-align:
                center;

            margin-bottom:
                50px;
        }


        .policy-label {

            margin:
                0 0 12px;

            color:
                #315f9f;

            font-size:
                0.75rem;

            font-weight:
                800;

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;
        }


        .policy-heading h1 {

            margin:
                0 0 15px;

            color:
                #102f5f;

            font-size:
                clamp(2.2rem, 5vw, 4rem);

            line-height:
                1.1;
        }


        .policy-heading p {

            margin:
                0;

            color:
                #58708f;

            font-size:
                0.95rem;
        }


        /* =========================================================
           POLICY CONTENT
        ========================================================= */

        .policy-content-card {

            background:
                rgba(255, 252, 246, 0.82);

            border:
                1px solid
                rgba(16, 47, 95, 0.10);

            border-radius:
                20px;

            padding:
                clamp(25px, 5vw, 55px);

            box-shadow:
                0 12px 40px
                rgba(16, 47, 95, 0.06);
        }


        .policy-content {

            color:
                #173d70;

            font-size:
                1rem;

            line-height:
                1.9;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;
        }


        .policy-content:empty::before {

            content:
                "This policy has not been published yet.";

            color:
                #71839b;

            font-style:
                italic;
        }


        /* =========================================================
           LAST UPDATED
        ========================================================= */

        .policy-updated {

            margin-top:
                40px;

            padding-top:
                20px;

            border-top:
                1px solid
                rgba(16, 47, 95, 0.10);

            color:
                #71839b;

            font-size:
                0.82rem;
        }


        /* =========================================================
           LOADING / ERROR
        ========================================================= */

        .policy-message {

            text-align:
                center;

            padding:
                80px 20px;

            color:
                #58708f;

            font-size:
                1rem;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            .policy-main {

                width:
                    min(94%, 900px);

                padding:
                    45px 0 70px;
            }


            .policy-heading {

                margin-bottom:
                    30px;
            }


            .policy-content-card {

                padding:
                    25px 20px;

                border-radius:
                    16px;
            }


            .policy-content {

                font-size:
                    0.95rem;

                line-height:
                    1.8;
            }

        }

    </style>

</head>


<body class="policy-page">


    <!-- =========================================================
         WEBSITE HEADER
    ========================================================= -->

    <header class="navbar">

        <div class="nav-container">

            <a
                href="index.html"
                class="brand"
            >
                FOFANA<span>.</span>
            </a>


            <a
                href="index.html#contact"
                class="nav-contact"
            >
                Let's Talk
            </a>

        </div>

    </header>



    <!-- =========================================================
         POLICY CONTENT
    ========================================================= -->

    <main class="policy-main">


        <section
            class="policy-heading"
            id="policyHeading"
        >

            <p class="policy-label">
                LEGAL & POLICIES
            </p>


            <h1 id="policyTitle">
                Cookies Policy
            </h1>


            <p>
                Please read this policy carefully.
            </p>

        </section>



        <section class="policy-content-card">


            <div
                id="policyContent"
                class="policy-content"
            >

                <div class="policy-message">
                    Loading policy...
                </div>

            </div>


            <div
                id="policyUpdated"
                class="policy-updated"
            >
            </div>

        </section>

    </main>



    <!-- =========================================================
         SUPABASE
    ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =========================================================
           SUPABASE
        ========================================================= */

        const SUPABASE_URL =
            "https://uryfgatzyesolwwmugin.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_QL4lxGKETA1_xMFFJ7RV5g_Wuyi_x-d";


        const portfolioSupabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================================
           POLICY TYPE
        ========================================================= */

        const policyType =
            "cookies";


        /* =========================================================
           LOAD PUBLISHED POLICY
        ========================================================= */

        async function loadPublicPolicy() {

            const titleElement =
                document.getElementById(
                    "policyTitle"
                );


            const contentElement =
                document.getElementById(
                    "policyContent"
                );


            const updatedElement =
                document.getElementById(
                    "policyUpdated"
                );


            try {

                const {
                    data,
                    error
                } =
                    await portfolioSupabase
                        .from("legal_policies")
                        .select(
                            "title, content, last_updated"
                        )
                        .eq(
                            "policy_type",
                            policyType
                        )
                        .eq(
                            "status",
                            "published"
                        )
                        .maybeSingle();


                if (error) {

                    throw error;

                }


                if (!data) {

                    contentElement.innerHTML = `
                        <div class="policy-message">
                            This policy has not been published yet.
                        </div>
                    `;

                    updatedElement.textContent =
                        "";

                    return;

                }


                titleElement.textContent =
                    data.title;


                contentElement.textContent =
                    data.content || "";


                if (data.last_updated) {

                    const date =
                        new Date(
                            data.last_updated
                        );


                    updatedElement.textContent =
                        "Last updated: " +
                        date.toLocaleDateString(
                            undefined,
                            {
                                year: "numeric",
                                month: "long",
                                day: "numeric"
                            }
                        );

                }

            } catch (error) {

                console.error(
                    "LOAD PUBLIC POLICY ERROR:",
                    error
                );


                contentElement.innerHTML = `
                    <div class="policy-message">
                        Unable to load this policy.
                        Please try again later.
                    </div>
                `;

            }

        }


        loadPublicPolicy();

    </script>


</body>

</html>
