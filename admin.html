<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Fofana Tech</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="admin-page">


    <!-- =========================
         ADMIN LOGIN
    ========================== -->

    <main class="admin-login-page">

        <div class="admin-login-glow glow-one"></div>
        <div class="admin-login-glow glow-two"></div>


        <div class="admin-login-card">


            <!-- LOGO -->

            <div class="admin-logo">

                <img
                    src="images/fofana-tech-logo.png"
                    alt="Fofana Tech Logo"
                >

            </div>


            <!-- HEADING -->

            <p class="admin-label">
                PRIVATE AREA
            </p>

            <h1>
                Admin Login
            </h1>

            <p class="admin-description">
                Sign in to manage your portfolio projects.
            </p>


            <!-- LOGIN FORM -->

            <form id="adminLoginForm">


                <div class="form-group">

                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login-button"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>


            </form>


            <!-- BACK TO WEBSITE -->

            <a
                href="index.html"
                class="back-to-portfolio"
            >
                ← Back to Portfolio
            </a>


        </div>

    </main>


    <script src="admin.js"></script>

</body>

</html>
